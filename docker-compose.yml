services:
  mysql:
    image: mysql:8.4
    container_name: nn-college360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college360
    ports:
      - "3306:3306"
    volumes:
      - college360_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  college360_mysql:
